<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f3b57" />
    <title>OSM Field Collector</title>
  </head>
  <body>
    <header id="top-bar">
      <button id="project-name" class="project" title="Switch project">My survey</button>
      <span id="net-badge" hidden>offline</span>
      <span id="gps-badge" class="bad">GPS: starting…</span>
    </header>

    <div id="map"></div>
    <div id="crosshair" aria-hidden="true"></div>

    <div id="map-buttons">
      <button id="btn-zoom-in" class="fab" aria-label="Zoom in">+</button>
      <button id="btn-zoom-out" class="fab" aria-label="Zoom out">−</button>
      <button id="btn-follow" class="fab active" aria-label="Follow my position">◎</button>
    </div>

    <nav id="bottom-bar">
      <button id="btn-point"><span class="ico">●</span>Point</button>
      <button id="btn-way"><span class="ico">〰</span>Way</button>
      <button id="btn-list"><span class="ico">☰</span>List</button>
      <button id="btn-upload"><span class="ico">⇪<span class="count"></span></span>Upload</button>
      <button id="btn-more"><span class="ico">⋮</span>More</button>
    </nav>

    <div id="record-panel" hidden></div>
    <div id="toast" role="status"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
