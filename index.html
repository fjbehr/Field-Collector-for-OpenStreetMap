<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#13293d" />
    <title>Field Collector for OpenStreetMap</title>
  </head>
  <body>
    <header id="top-bar">
      <button id="project-name" class="project" title="Switch project">
        <i data-icon="folder"></i><span class="name">My survey</span><i data-icon="chevron-down" class="chev"></i>
      </button>
      <button id="btn-search" class="top-icon" aria-label="Find a place"><i data-icon="search"></i></button>
      <span id="net-badge" class="chip" hidden><i data-icon="offline"></i>Offline</span>
      <span id="gps-badge" class="chip bad"><i data-icon="gps"></i><span class="t">GPS…</span></span>
    </header>

    <div id="map"></div>
    <div id="crosshair" aria-hidden="true"></div>

    <div id="map-buttons">
      <div class="fab-group">
        <button id="btn-zoom-in" class="fab" aria-label="Zoom in"><i data-icon="plus"></i></button>
        <button id="btn-zoom-out" class="fab" aria-label="Zoom out"><i data-icon="minus"></i></button>
      </div>
      <button id="btn-follow" class="fab round active" aria-label="Follow my position"><i data-icon="locate"></i></button>
    </div>

    <nav id="bottom-bar">
      <button id="btn-point" class="primary-action"><span class="ico"><i data-icon="point"></i></span>Point</button>
      <button id="btn-way" class="primary-action"><span class="ico"><i data-icon="way"></i></span>Way</button>
      <button id="btn-list"><span class="ico"><i data-icon="list"></i></span>List</button>
      <button id="btn-upload"><span class="ico"><i data-icon="upload"></i><span class="count"></span></span>Upload</button>
      <button id="btn-more"><span class="ico"><i data-icon="more"></i></span>More</button>
    </nav>

    <div id="record-panel" hidden></div>
    <div id="toast" role="status"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
